function pet(sleep=false,small=false,friend=false){const g=friend?3:growthStage();if(g===0)return `<svg viewBox="0 0 230 230" class="pet" role="img" aria-label="Monster egg"><defs><radialGradient id="egg"><stop stop-color="#fffbe6"/><stop offset="1" stop-color="#dac4eb"/></radialGradient></defs><ellipse cx="115" cy="203" rx="61" ry="9" fill="#b6c99d"/><path d="M115 28 C77 28 48 107 52 157 C56 218 174 218 178 157 C182 107 153 28 115 28Z" fill="url(#egg)" stroke="#94829e" stroke-width="3"/><ellipse cx="86" cy="99" rx="11" ry="17" fill="#c6b1df"/><ellipse cx="143" cy="143" rx="16" ry="12" fill="#c6b1df"/><ellipse cx="79" cy="166" rx="8" ry="11" fill="#c6b1df"/><path d="M100 123 q15 14 30 0" fill="none" stroke="#a496ae" stroke-width="3"/></svg>`;const scale=g===1?.62:g===2?.81:1;const w=210*scale,h=187*scale,x=115-w/2,y=198-h;

function toast(en,zh){$('#toast').className='toast';$('#toast').textContent=t(en,zh);clearTimeout(window.tt);window.tt=setTimeout(()=>{$('#toast').textContent='';$('#toast').className=''},2800)}
function header(ey,title,desc){return `<div class="intro"><div class="eyebrow">${ey}</div><h1>${title}</h1><p>${desc}</p></div>`}

function render(){document.documentElement.lang=lang==='en'?'en':'zh-CN';$('#language').textContent=t('中文','English');$('#reset').textContent=t('Reset demo','重置演示');$('#note').innerHTML=t('<b>Clickable classroom prototype</b><br>Record something you did, then feed your monster.<br><br>Friends are demo characters. Progress stays in this browser.<br><br>Bird reference artwork: <a href="https://finchcare.com" target="_blank" rel="noopener">Finch</a>. Classroom demonstration.','<b>课堂可点击原型</b><br>记录今天做到了什么，再喂怪兽。<br><br>好友为演示角色，进度仅保存在当前浏览器。<br><br>小鸟参考图来自 <a href="https://finchcare.com" target="_blank" rel="noopener">Finch</a>，用于课堂演示。');

else {let logs=state.logs.filter(l=>l.date===today);html=header('MY DAY',t('What did you do today?','今天，你做到了什么？'),t('Tap something you did. No planning required.','做到了就点一下，不需要先制定计划。'))+`<div class="content">${stage(false,t(reaction?'Growing together!':'Every little thing counts.',reaction?'一起慢慢长大！':'每件小事都算数。'))}<div class="stats"><span>${t('Level','等级')} ${1+Math.floor(state.earned/50)}</span><span>🍪 ${state.food}</span><span>✦ ${state.balance} EXP</span></div>${growth()}<div class="quickgrid">${choices.map(([id,icon,en,zh])=>{let done=logs.some(l=>l.key===id);return `<button class="quick ${done?'logged':''}" data-log="${id}" ${done?'disabled':''}><span>${done?'✓':icon}</span><b>${t(en,zh)}</b><small>${done?t('Recorded','已记录'):t('I did this','我做到了')}</small></button>`}).join('')}</div><button class="wide primary" data-action="add">＋ ${t('Record something else / Add to-do','记录其他事情／添加待办')}</button>${state.tasks.length?`<div class="card"><h2>${t('My to-dos','我的待办')}</h2>${state.tasks.map((v,i)=>`<div class="todo"><span>${esc(v)}</span><button data-task="${i}">✓ ${t('Done','完成')}</button></div>`).join('')}</div>`:''}${logs.length?`<p class="caption">${t('Recorded today:','今天已记录：')} ${logs.length} ${t('moments.','件小事。')} <button class="subtle" data-action="undo">${t('Undo last record','撤销上一条')}</button></p>`:''}<div class="actions" style="margin-top:15px"><button data-action="feed" ${state.food<1?'disabled':''}>🍪 ${t('Feed','喂怪兽')}</button><button data-action="login" ${state.login===today?'disabled class="checked"':''}>${state.login===today?t('✓ Checked in','✓ 已签到'):t('Daily check-in · +5 EXP','每日签到 · +5 EXP')}</button></div><button class="ai-entry wide" data-action="ai">✧ ${t('Have a big goal? Get help planning','有一个大目标？试试拆解助手')} →</button><p class="caption">${t('Rest whenever you need. Your monster never grows backwards.','需要时就休息，怪兽不会因为你离开而退化。')}</p></div>`}}
if(page==='ai'){
const badge=`<p class="ai-badge">${t('AI flow demo · template suggestions, not live AI','AI 流程演示 · 模板建议，尚未连接真实 AI')}</p>`;
if(aiMode==='review')html=header('02 / REVIEW TOGETHER',t('A draft, not a demand.','这是建议，由你来决定。'),esc(goalDraft.goal))+`<div class="content">${badge}<div class="ai-path"><span>${t('Understand','明确目标')}</span> → <span>${t('Make progress','逐步完成')}</span> → <span>${t('Review','回顾调整')}</span></div><p class="helper">${goalDraft.kind==='health'?t('For health goals, discuss a safe plan with a qualified professional. This demo does not prescribe diets or weight-loss targets.','健康目标需要结合个人情况与专业人士讨论。此演示不提供减重处方或食谱。'):t('These are sample actions. Change them to fit your goal and pace.','以下为示例行动，请按你的目标和节奏修改。')}</p><form id="reviewForm"><fieldset class="ai-choices"><legend>${t('Choose what to add. Start with one if you like.','选择想加入待办的内容，可以先选一项。')}</legend>${goalDraft.items.map((v,i)=>`<div class="ai-row"><label class="ai-check"><input type="checkbox" name="pick" value="${i}" ${i===0?'checked':''}><span>${t('Add','加入')}</span></label><label class="ai-edit"><span>${t('Action','行动')} ${i+1}</span><input name="action${i}" value="${esc(v)}" maxlength="150" aria-label="${t('Action','行动')} ${i+1}"></label></div>`).join('')}</fieldset><p class="error" id="reviewError" role="alert"></p><button class="primary wide" type="submit">${t('Confirm & add to My to-dos','确认，加入我的待办')}</button></form><div class="actions" style="margin-top:14px"><button data-action="ai-smaller">${t('Make it smaller','再小一点')}</button><button data-action="ai-edit">${t('Change goal','修改目标')}</button><button class="subtle" data-action="ai-cancel">${t('Cancel · add nothing','取消，不添加')}</button></div><p class="caption">${t('Planning earns no EXP. Your completed activities help your pet grow.','制定计划不发经验值，完成后的记录才帮助小伙伴成长。')}</p></div>`;
else if(aiMode==='saved'&&state.goalPlan)html=header('03 / YOUR PLAN',t('One thing at a time.','一次做一件就好。'),esc(state.goalPlan.goal))+`<div class="content">${badge}${stage(false,t('We can take our time.','我们可以慢慢来。'))}<div class="success">✓ ${t('Your selected actions are saved in My to-dos.','你选择的行动已加入“我的待办”。')}</div><div class="card"><h2>${t('You chose','你选择了')}</h2>${state.goalPlan.items.map(v=>`<p>✓ ${esc(v)}</p>`).join('')}<p class="helper">${t('Pace:','节奏：')} ${esc(state.goalPlan.pace)}</p></div><button class="primary wide" data-action="home">${t('Go to My to-dos','去我的待办')}</button><button class="subtle" data-action="ai-new">${t('Plan another goal','规划另一个目标')}</button></div>`;
else html=header('01 / YOUR BIG GOAL',t('A big goal. A gentler start.','大目标，也能慢慢来。'),t('Only use this when you want planning support.','需要规划帮助时，再来这里。'))+`<div class="content">${badge}<div class="ai-mini">${pet(false,true)}<p>${t('You choose the goal. We explore the next actions.','目标由你决定，一起看看可以怎么做。')}</p></div><form class="form" id="goalForm"><label for="bigGoal">${t('What would you like to work towards?','你想完成什么大目标？')}</label><input id="bigGoal" name="goal" maxlength="160" placeholder="${t('e.g. Finish my course assignment','例如：完成课程作业')}" value="${esc(goalDraft.goal)}"><div class="ai-examples">${[['course',t('Course assignment','完成课程作业')],['room',t('Tidy my room','整理房间')],['skill',t('Learn a new skill','学习新技能')]].map(([k,v])=>`<button type="button" data-example="${k}">${v}</button>`).join('')}</div><label for="pace">${t('What pace feels comfortable?','什么节奏比较适合你？')}</label><select id="pace"><option value="week" ${goalDraft.pace==='week'?'selected':''}>${t('This week','这一周')}</option><option value="month" ${goalDraft.pace==='month'?'selected':''}>${t('Over a month','一个月慢慢来')}</option><option value="own" ${goalDraft.pace==='own'?'selected':''}>${t('My own pace','按自己的节奏')}</option></select><p class="error" id="goalError" role="alert"></p><button class="primary wide" type="submit">${t('Show a suggested plan','看看拆解建议')}</button></form><button class="subtle" data-action="home">${t('I just want to record my day','我只想直接记录日常')}</button></div>`;
}
if(page==='friends')html=header('A LITTLE COMPANY',t('Bring a friend along.','邀请朋友一起养。'),t('Your monsters can visit and play together.','让彼此的怪兽串门、一起玩。'))+`<div class="content">${state.friend?`<div class="scene">${pet()}<span class="heart">♡</span>${pet(false,false,true)}</div><div class="friend" style="margin-top:18px"><div><h2>${t('Mia & Sprout','Mia 和小芽')}</h2><p>${t('Demo friend · personal tasks are not shared.','演示好友 · 不共享个人任务。')}</p></div></div><button class="primary wide" data-action="play">${t('Let our monsters play','让怪兽一起玩')}</button><button class="subtle" data-action="removeFriend">${t('Remove demo friend','移除演示好友')}</button>`:`${stage(false,t('A friend for us?','一起找个朋友？'))}<div class="card"><h2>${t('Add a friend','添加好友')}</h2><p>${t('Try demo code MIA123.','试试演示好友码 MIA123。')}</p><form id="friendForm"><label for="friendCode" class="helper">${t('Friend code','好友码')}</label><input id="friendCode" placeholder="MIA123" maxlength="16"><p id="friendError" class="error" role="alert"></p><button class="primary wide">${t('Send friend request','发送好友申请')}</button></form></div>`}<p class="caption">${t('Demo interaction only. No request is sent to a real person.','这里只演示好友互动，不会向真实用户发送申请。')}</p></div>`;
if(page==='wardrobe')html=header('A LITTLE PERSONALITY',t('Make your monster yours.','装扮你的怪兽。'),t('Earn EXP, choose an accessory, then wear it.','获得经验值，挑选装备，再穿上它。'))+`<div class="content">${stage()}<div class="balance"><span>✦ ${state.balance} ${t('EXP to spend','可用经验值')}</span><span>${t('Level stays when you shop.','购买不会降低等级。')}</span></div><div class="grid">${[['hat','△',t('Sunny hat','小太阳帽'),10],['bow','⋈',t('Pink bow','粉色蝴蝶结'),15],['scarf','≋',t('Soft scarf','柔软围巾'),20]].map(([id,icon,name,cost])=>`<div class="item"><span class="icon">${icon}</span><strong>${name}</strong><div class="helper">${cost} EXP</div><button data-buy="${id}" ${state.wear===id?'disabled':''}>${state.wear===id?t('Wearing','已穿戴'):state.owned.includes(id)?t('Wear','穿戴'):t('Buy','购买')}</button></div>`).join('')}</div><button class="subtle" data-action="unwear">${t('Remove accessories','取下装备')}</button><p class="caption">${t('Record an activity: +10 EXP. Daily hello: +5 EXP. Demo values.','记录一件事 +10 EXP，每日见面 +5 EXP。数值仅用于演示。')}</p></div>`;
if(page==='companion')html=header('NEARBY, NOT IN THE WAY',t('A tiny friend, outside the app.','不打开 App，也有陪伴。'),t('A preview of the phone widget and desktop pet.','手机小组件与电脑桌面宠物的效果预览。'))+`<div class="content"><div class="tabs"><button class="${preview==='phone'?'secondary':''}" data-preview="phone">${t('Phone widget','手机小组件')}</button><button class="${preview==='desktop'?'secondary':''}" data-preview="desktop">${t('Desktop pet','电脑桌面宠物')}</button></div>${preview==='phone'?`<div class="phone"><div class="widget">${pet(state.paused,true)}<div><b>${t('Tiny Monster','小怪兽')}</b><p>${t('Your day, with a little company.','陪你记录今天。')}</p></div></div><div class="appdots">${'<i></i>'.repeat(8)}</div><button class="primary wide" data-action="home">${t('Record my day','记录今天')}</button></div>`:`<div class="workspace"><div class="paper">${t('My day','我的一天')}<i></i><i></i><i></i><i></i></div><button class="floating" data-action="home" aria-label="${t('Open next step','记录今天')}">${pet(state.paused)}</button></div><p class="caption">${t('Click your monster to record your day.','点击小怪兽，记录今天。')}</p>`}<p class="caption">${t('Visual simulation in this website. This does not install a real widget or desktop pet.','此处为网页效果模拟，不会安装真实小组件或桌面宠物。')}</p></div>`;
$('#app').innerHTML=html;bind();}
function daily(){let d=new Date().toLocaleDateString('en-CA');if(state.login===d){toast('Today’s hello is already collected.','今天的见面奖励已经领取啦。');return}state.login=d;state.earned+=5;state.balance+=5;save();render();toast('+5 EXP. Happy to see you!','+5 EXP，很高兴见到你！')}
function bind(){
document.querySelectorAll('[data-example]').forEach(b=>b.onclick=()=>{$('#bigGoal').value=b.textContent;goalDraft.kind=b.dataset.example});
if($('#goalForm'))$('#goalForm').onsubmit=e=>{e.preventDefault();let goal=$('#bigGoal').value.trim();if(!goal){$('#goalError').textContent=t('Please enter a goal or choose an example.','请输入目标，或选择一个示例。');return}goalDraft.goal=goal;goalDraft.pace=$('#pace').value;let kind=/减重|减肥|瘦|体重|weight|diet|lose.*kg/i.test(goal)?'health':/房间|整理|room|tidy|clean/i.test(goal)?'room':/技能|学习|skill|learn/i.test(goal)?'skill':/作业|课程|论文|assignment|course|essay/i.test(goal)?'course':'general';goalDraft.kind=kind;setSuggestions(false);aiMode='review';render()};
if($('#reviewForm'))$('#reviewForm').onsubmit=e=>{e.preventDefault();let selected=[...document.querySelectorAll('input[name="pick"]:checked')].map(c=>$(`input[name="action${c.value}"]`).value.trim());if(!selected.length||selected.some(v=>!v)){$('#reviewError').textContent=t('Choose at least one action and give it a name.','请至少选择一个行动，并填写内容。');return}selected=[...new Set(selected)];selected.forEach(v=>{if(!state.tasks.includes(v))state.tasks.push(v)});state.goalPlan={goal:goalDraft.goal,pace:t(goalDraft.pace==='week'?'This week':goalDraft.pace==='month'?'Over a month':'My own pace',goalDraft.pace==='week'?'这一周':goalDraft.pace==='month'?'一个月慢慢来':'按自己的节奏'),items:selected};save();aiMode='saved';render()};
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;if(page==='ai')aiMode=state.goalPlan?'saved':'input';mode='home';reaction=false;render()});document.querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>{preview=b.dataset.preview;render()});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action));document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{let id=b.dataset.buy,cost={hat:10,bow:15,scarf:20}[id];if(!state.owned.includes(id)){if(state.balance<cost){toast('Not enough EXP. Record something you did or collect your daily hello.','经验值还不够，记录做过的事或领取每日见面奖励。');return}state.balance-=cost;state.owned.push(id)}state.wear=id;save();render();toast('Accessory equipped!','新装备穿好啦！')});document.querySelectorAll('[data-log]').forEach(b=>b.onclick=()=>{let id=b.dataset.log;let names={breakfast:t('Had breakfast','吃了早餐'),wake:t('Got out of bed','起床了'),exercise:t('Moved my body','运动了'),coffee:t('Enjoyed a coffee','喝了咖啡'),water:t('Drank water','喝了水'),homework:t('Finished homework','完成作业')};record(id,names[id])});document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{let i=Number(b.dataset.task),v=state.tasks[i];if(!v)return;if(record('custom:'+v.toLowerCase(),v))state.tasks.splice(i,1);save()});if($('#taskForm'))$('#taskForm').onsubmit=e=>{e.preventDefault();let v=$('#title').value.trim();if(!v){$('#formError').textContent=t('Please enter an activity or task.','请写下日常或任务。');return}if(e.submitter?.value==='later'){if(!state.tasks.includes(v))state.tasks.push(v);mode='home';save();render();toast('Saved as a to-do. No steps needed.','已存为待办，不用拆解步骤。')}else record('custom:'+v.toLowerCase(),v)};if($('#friendForm'))$('#friendForm').onsubmit=e=>{e.preventDefault();if($('#friendCode').value.trim().toUpperCase()!=='MIA123'){$('#friendError').textContent=t('Use MIA123 to try this demo.','请用 MIA123 体验演示。');return}$('#helpTitle').textContent=t('Mia accepted your request!','Mia 同意了好友申请！');$('#helpBody').textContent=t('This acceptance is simulated for the classroom demo. Now your monsters can play.','这里模拟好友同意申请。现在可以让怪兽一起玩了。');state.friend=true;save();render();$('#help').showModal()}}
function setSuggestions(smaller){let map={course:smaller?[t('Open the assignment brief','打开作业要求'),t('Read its first requirement','读第一条要求'),t('Write one note about it','记下一个要点')]:[t('Read the brief and list three requirements','阅读作业要求，列出三个要点'),t('Write three bullet points for an outline','写三个提纲要点'),t('Draft one paragraph, then review it','写一段草稿，再回看一下')],room:smaller?[t('Choose one small surface','选择一小块桌面'),t('Put away one item','收好一件物品'),t('Decide whether to continue or rest','决定继续还是休息')]:[t('Choose one area to tidy first','选择一个想先整理的区域'),t('Put away five items in that area','收好这个区域的五件物品'),t('Check the area and choose the next one','回看这个区域，再选择下一处')],skill:smaller?[t('Name one thing you want to learn','写下一个想学的内容'),t('Open one beginner resource','打开一份入门资料'),t('Try one tiny exercise','试做一个小练习')]:[t('Choose one specific skill to practise','选定一个具体想练的技能'),t('Pick one beginner lesson','选择一节入门课程'),t('Try one exercise and note what you learned','试一个练习，记下学到了什么')],health:[t('Write down questions for a qualified health professional','写下想向专业人士咨询的问题'),t('Discuss a safe goal that fits your situation','讨论适合个人情况的安全目标'),t('Agree on one manageable action and a review point','确认一个能做到的行动和回顾时间')],general:smaller?[t('Write your goal in one sentence','用一句话写下目标'),t('Choose one thing you can open or prepare','选一件可以打开或准备的东西'),t('Do that one small action','做这个小动作')]:[t('Describe what finishing this goal would look like','描述完成这个目标时是什么样子'),t('Choose one action you can do today','选择今天可以做的一个行动'),t('Review what happened and adjust your next action','回顾完成情况，调整下一个行动')]};goalDraft.items=map[goalDraft.kind]||map.general}
function record(key,label){let date=new Date().toLocaleDateString('en-CA');if(state.logs.some(l=>l.key===key&&l.date===date)){toast('Already recorded today.','今天已经记录过这件事啦。');return false}state.logs.push({key,label,date});state.last=label;state.earned+=10;state.balance+=10;state.food++;mode='home';page='home';reaction=true;save();render();toast(state.earned===10?'Your egg is hatching! +10 EXP':'Recorded ✓ +10 EXP',state.earned===10?'蛋孵化啦！+10 EXP':'已记录 ✓ +10 EXP');return true}
function act(a){reaction=false;if(a==='ai'){page='ai';aiMode=state.goalPlan?'saved':'input'}if(a==='ai-new'){page='ai';aiMode='input';goalDraft={goal:'',pace:'week',kind:'course',items:[]}}if(a==='ai-smaller'){setSuggestions(true);aiMode='review'}if(a==='ai-edit'){aiMode='input'}if(a==='ai-cancel'){page='home';mode='home'}if(a==='home'){page='home';mode='home'}if(a==='add'){page='home';mode='add'}if(a==='feed'){if(!state.food)return;state.food--;page='home';mode='home';reaction=true;toast('Yum! Your monster is happy.','好吃！怪兽很开心。')}if(a==='undo'){if(!state.logs.length)return;state.logs.pop();state.earned=Math.max(0,state.earned-10);state.balance=Math.max(0,state.balance-10);state.food=Math.max(0,state.food-1);mode='home';toast('Record and reward undone.','已撤销记录和对应奖励。')}if(a==='login'){daily();return}if(a==='unwear')state.wear='none';if(a==='removeFriend')state.friend=false;if(a==='play'){reaction=true;toast('Your monsters play together. ♡','两只小怪兽开心地一起玩。♡')}save();render()}
$('#language').onclick=()=>{lang=lang==='en'?'zh':'en';render()};$('#reset').onclick=()=>{state=initial();mode='home';page='home';aiMode='input';goalDraft={goal:'',pace:'week',kind:'course',items:[]};reaction=false;save();render();toast('Demo reset. Record something you did.','演示已重置，试试记录日常。')};$('#closeHelp').onclick=()=>$('#help').close();render();
</script></body></html>
